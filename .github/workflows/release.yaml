name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run
        required: false
        type: boolean
        default: false
      debug:
        description: Debug mode
        required: false
        type: boolean
        default: false
      releaseType:
        description: Release type
        required: false
        type: choice
        options:
          - stable
          - alpha
          - beta
          - rc
        default: stable
      firstRelease:
        description: First release (allow missing previous release reference)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'pplancq'
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Release
        uses: pplancq/actions/nx-release@2c562638cd9f0ca64f237af46f6052e71b2536b8 # v1.1.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-type: ${{ inputs.releaseType }}
          first-release: ${{ inputs.firstRelease }}
          dry-run: ${{ inputs.dryRun }}
          debug: ${{ inputs.debug }}
          build-command: npm run build --workspace @pplancq/nx-release-plugin
          git-author-email: ${{ vars.GIT_AUTHOR_EMAIL }}
          git-author-name: ${{ vars.GIT_AUTHOR_NAME }}
          git-committer-email: ${{ vars.GIT_COMMITTER_EMAIL }}
          git-committer-name: ${{ vars.GIT_COMMITTER_NAME }}
